{% import '_growth_macros.html' as ui %}
{% if fragment == 'workers' %}
<div id="worker-panel" class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
  {% for worker in workers %}
    {{ ui.worker_card(worker) }}
  {% endfor %}
</div>
{% elif fragment == 'deep_scan_result' %}
<div id="deep-scan-result" class="rounded-2xl border px-4 py-3 text-sm {% if deep_scan.status == 'ok' %}border-emerald-500/30 bg-emerald-500/10 text-emerald-100{% else %}border-rose-500/30 bg-rose-500/10 text-rose-100{% endif %}">
  {{ deep_scan.message }}
</div>
{% endif %}
