<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inbox de Reseñas | Lokigi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    body { background: #09111f; }
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 rgba(16,185,129,0); } 50% { box-shadow: 0 0 28px rgba(16,185,129,0.28); } }
    .fresh-card { animation: pulseGlow 1.2s ease-in-out 2; }
  </style>
</head>
<body class="min-h-screen text-white">
  <div class="mx-auto max-w-6xl px-4 py-8">
    <header class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-xs uppercase tracking-[0.24em] text-emerald-300/80">Plan Starter · Escudo Operativo</p>
        <h1 class="mt-2 text-3xl font-semibold">Inbox de Reseñas</h1>
        <p class="mt-2 text-sm text-slate-300">Aprueba, edita o regenera respuestas sin recargar la página para {{ business_name }}.</p>
      </div>
      <div class="flex gap-3">
        <a href="/starter/auto-send?user_id={{ user_id }}" class="rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm font-semibold text-white transition hover:bg-white/10">Configurar auto-envío</a>
        <button class="rounded-xl bg-emerald-500 px-4 py-3 text-sm font-semibold text-slate-950 transition hover:bg-emerald-400" hx-get="/starter/inbox/fragments/list?user_id={{ user_id }}" hx-target="#pending-list" hx-swap="outerHTML">Actualizar inbox</button>
      </div>
    </header>
    <div id="toast-zone" class="mb-4"></div>
    <section class="glass rounded-3xl p-5">
      <div class="mb-4 flex items-center justify-between gap-3">
        <div>
          <p class="text-xs uppercase tracking-[0.22em] text-slate-400">Pendientes de Acción</p>
          <h2 class="mt-1 text-2xl font-semibold">Reseñas nuevas</h2>
        </div>
        <span class="rounded-full bg-white/5 px-3 py-2 text-sm text-slate-300">{{ pending_cards|length }} pendientes</span>
      </div>
      {% include 'starter_inbox_fragments.html' with context %}
    </section>
  </div>
  <script>
    const userId = {{ user_id | tojson }};

    async function ensureNotificationPermission() {
      if (!('Notification' in window)) return 'unsupported';
      if (Notification.permission === 'default') {
        return Notification.requestPermission();
      }
      return Notification.permission;
    }

    function highlightReviewCard(reviewPk) {
      const card = document.getElementById(`review-card-${reviewPk}`);
      if (!card) return;
      card.classList.add('fresh-card');
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => card.classList.remove('fresh-card'), 2600);
    }

    function openReviewFromNotification(payload) {
      const targetHash = `#review-card-${payload.review_pk}`;
      if (window.location.hash !== targetHash) {
        window.location.hash = targetHash;
      }
      highlightReviewCard(payload.review_pk);
    }

    function showLocalReviewNotification(payload) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      const notification = new Notification(`⭐ Nueva reseña de ${payload.author}!`, {
        body: payload.comment_snippet
          ? `La IA ya redactó una respuesta profesional. ${payload.comment_snippet}`
          : 'La IA ya redactó una respuesta profesional. Haz clic para revisarla.',
        tag: `starter-review-${payload.review_pk}`,
      });
      notification.onclick = () => {
        window.focus();
        openReviewFromNotification(payload);
        notification.close();
      };
    }

    function refreshInboxAndFocus(payload) {
      htmx.ajax('GET', `/starter/inbox/fragments/list?user_id=${encodeURIComponent(userId)}`, '#pending-list')
        .then(() => {
          requestAnimationFrame(() => openReviewFromNotification(payload));
        });
    }

    async function startInboxSocket() {
      await ensureNotificationPermission();
      const socket = io({
        path: '/starter-realtime/socket.io',
        transports: ['websocket'],
        auth: { user_id: userId },
        query: { user_id: userId },
      });
      socket.on('new_review_ready', (payload) => {
        showLocalReviewNotification(payload);
        refreshInboxAndFocus(payload);
      });
      socket.on('connect_error', () => {
        window.setTimeout(startInboxSocket, 2500);
      });
    }

    window.addEventListener('load', () => {
      startInboxSocket();
      if (window.location.hash.startsWith('#review-card-')) {
        const reviewPk = window.location.hash.replace('#review-card-', '');
        window.setTimeout(() => highlightReviewCard(reviewPk), 250);
      }
    });
  </script>
</body>
</html>
