<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vincular Google — Lokigi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-gradient-to-br from-slate-50 via-white to-indigo-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white border border-gray-100 rounded-2xl shadow-xl p-8">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-indigo-600 mb-3">
        <svg class="w-7 h-7" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-gray-900">Vincular cuenta de Google</h1>
      <p class="text-sm text-gray-500 mt-2">
        Hemos detectado que tu cuenta de Google es
        <strong class="text-gray-900">{{ email }}</strong>.
      </p>
      <p class="text-sm text-gray-500 mt-1">
        Quieres vincularla a tu perfil de Lokigi para entrar mas rapido la proxima vez?
      </p>
    </div>

    <form action="/auth/link-google" method="post" class="space-y-3">
      <button
        type="submit"
        name="action"
        value="confirm"
        class="w-full px-4 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm transition"
      >
        Si, vincular cuenta
      </button>
      <button
        type="submit"
        name="action"
        value="cancel"
        class="w-full px-4 py-3 rounded-xl border border-gray-200 text-gray-700 hover:bg-gray-50 font-medium text-sm transition"
      >
        Ahora no
      </button>
    </form>
  </div>
</body>
</html>
