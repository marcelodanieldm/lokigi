version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lokigi-api
    restart: unless-stopped
    env_file:
      - ../.env.production
    expose:
      - "8000"
    networks:
      - edge

  caddy:
    image: caddy:2.8-alpine
    container_name: lokigi-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ../.env.production
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - edge

networks:
  edge:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
