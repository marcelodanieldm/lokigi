version: '3.8'
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app/backend
    env_file:
      - ./backend/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - redis
  celery-scraper:
    build: .
    command: celery -A backend.celery_app:celery worker -Q scraping -n scraper@%h
    volumes:
      - ./backend:/app/backend
    env_file:
      - ./backend/.env.example
    depends_on:
      - redis
  celery-ai:
    build: .
    command: celery -A backend.celery_app:celery worker -Q ai -n ai@%h
    volumes:
      - ./backend:/app/backend
    env_file:
      - ./backend/.env.example
    depends_on:
      - redis
  flower:
    build: .
    command: celery -A backend.celery_app:celery flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - ./backend/.env.example
    depends_on:
      - redis
